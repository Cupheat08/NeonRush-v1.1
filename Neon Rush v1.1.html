<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Rush v1.1</title>
<style>
:root{--bg:#0b1030;--ink:#f2f4ff;--accent:#ffd34d;--panel:#141a4a;color-scheme:dark;box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e8ecff;--ink:#1b2150;--accent:#c98a00;--panel:#ffffff;color-scheme:light}}
:root[data-theme="light"]{--bg:#e8ecff;--ink:#1b2150;--accent:#c98a00;--panel:#ffffff;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,"Noto Sans CJK SC","Microsoft YaHei","Hiragino Sans",sans-serif;touch-action:none;user-select:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;font-size:15px;font-weight:700;pointer-events:none;color:#fff;text-shadow:0 2px 6px #0008}
#toast{position:fixed;left:0;right:0;top:22%;text-align:center;padding:0 16px;font-size:26px;font-weight:700;color:#fff;text-shadow:0 2px 10px #000a;pointer-events:none;opacity:0;transition:opacity .4s}
#toast.on{opacity:1}
#mute{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding:8px 12px;font-size:20px;z-index:5}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 14px);background:radial-gradient(circle at 50% 30%,#0000 0,#0009 100%)}
.card{width:min(100%,440px);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;border-radius:26px;text-align:center;background:color-mix(in srgb,var(--panel) 76%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 22%,transparent),0 20px 60px #0009}
.card h1{margin:0;font-size:28px}
.card p{margin:0;max-width:36ch;line-height:1.4;font-size:15px}
.logo{font-size:60px!important;line-height:1;letter-spacing:1px;font-style:italic;background:linear-gradient(90deg,#37f2ff,#ff3df2);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff3df288)}
button{font:inherit;font-weight:700;font-size:17px;padding:11px 26px;border:0;border-radius:999px;background:var(--accent);color:#1b2150;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.big{font-size:22px;padding:14px 48px;background:linear-gradient(90deg,#37f2ff,#ff3df2);color:#0b1030;box-shadow:0 0 24px #ff3df266;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.big{animation:none}}
.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bal span,.chip{padding:5px 12px;border-radius:999px;font-size:16px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{padding:7px 12px;font-size:15px;background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink)}
.tab.on{background:var(--accent);color:#1b2150}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.sk{display:flex;flex-direction:column;gap:4px;padding:7px;border-radius:14px;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);font-size:13px;box-shadow:inset 0 0 0 2px transparent}
.sk small{font-weight:700;font-size:13px}
.sk.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.sk.no{box-shadow:inset 0 0 0 3px #ff4d6d}
.pv{width:100%;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:30px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.pv b{font-size:24px;text-shadow:0 1px 6px #000c}
.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.lg .alt{padding:10px 8px;font-size:16px}
.lg .on{box-shadow:inset 0 0 0 3px var(--accent)}
#pz{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 40px);padding:6px 12px;font-size:18px;z-index:5;display:none}
#fx{position:fixed;inset:0;pointer-events:none;display:none;backdrop-filter:sepia(.75) contrast(1.05);-webkit-backdrop-filter:sepia(.75) contrast(1.05);box-shadow:inset 0 0 120px #3a210a}
#toast{z-index:9}
.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.7);color:#ffd34d}}
.flash{animation:fl .7s}@keyframes fl{0%{box-shadow:0 0 0 0 #ffd34d}40%{transform:scale(1.12);box-shadow:0 0 24px 8px #ffd34d}}
.lock{opacity:.45}.ver{font-size:12px;opacity:.75}
.lb{width:100%;text-align:left;font-size:14px;max-height:34vh;overflow:auto}.lb div{display:flex;justify-content:space-between;padding:2px 8px;border-radius:8px}.lb .me{background:var(--accent);color:#1b2150}
input{font:inherit;padding:8px 12px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);width:70%}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><span>⭐ <b id="sc">0</b></span><span>🪙 <b id="co">0</b></span><span>💎 <b id="gm">0</b></span><span>Lv <b id="lv">1</b></span><span id="wn"></span><span>🏆 <b id="bs">0</b></span></div>
<div id="toast"></div>
<button id="mute" class="alt" aria-label="Sound">🔊</button>
<button id="pz" class="alt" aria-label="Pause">⏸</button><div id="fx"></div>
<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=Math.random,pick=a=>a[Math.floor(rnd()*a.length)];
const cvs=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};
const CT=c=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t};
const noise=(x,w,h,n,a,col)=>{col=col||'0,0,0';for(let i=0;i<n;i++){x.fillStyle='rgba('+col+','+rnd()*a+')';x.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2)}};
const diag=(x,w,h,a,b,st)=>{x.fillStyle=a;x.fillRect(0,0,w,h);x.fillStyle=b;for(let i=-h;i<w;i+=st*2){x.beginPath();x.moveTo(i,h);x.lineTo(i+st,h);x.lineTo(i+st+h,0);x.lineTo(i+h,0);x.fill()}};
const mk=c=>new THREE.MeshLambertMaterial({color:c});

/* ---------- languages ---------- */
const LG=['en','it','ru','zh','ja','pt','uk','de','es','cs'];
const LN={en:'🇬🇧 English',it:'🇮🇹 Italiano',ru:'🇷🇺 Русский',zh:'🇨🇳 中文',ja:'🇯🇵 日本語',pt:'🇧🇷 Português',uk:'🇺🇦 Українська',de:'🇩🇪 Deutsch',es:'🇪🇸 Español',cs:'🇨🇿 Čeština'};
const KEYS=['play','wardrobe','help','crash','lvl','tip1','tip2','tip3','tip4','lang'];
const TR={
en:['Play','Wardrobe','← → / A D: lane · ↑ / Space: jump · ↓ / S: slide. On phone: swipe. Every 500 points the level gets harder.','Crash!','Level','New: bars — slide under (↓)','New: walls — change lane','New: double gates','New: moving blocks','Language'],
it:['Gioca','Guardaroba','← → / A D: corsia · ↑ / Spazio: salto · ↓ / S: scivolata. Su telefono: scorri. Ogni 500 punti è più difficile.','Schianto!','Livello','Novità: barre — scivola sotto (↓)','Novità: muri — cambia corsia','Novità: porte doppie','Novità: blocchi mobili','Lingua'],
ru:['Играть','Гардероб','← → / A D — полоса · ↑ / пробел — прыжок · ↓ / S — присед. На телефоне — свайпы. Каждые 500 очков сложнее.','Столкновение!','Уровень','Новое: балки — приседай (↓)','Новое: стены — меняй полосу','Новое: двойные ворота','Новое: движущиеся блоки','Язык'],
zh:['开始','衣橱','← → / A D：换道 · ↑ / 空格：跳跃 · ↓ / S：滑铲。手机上滑动操作。每 500 分难度提升。','撞车了！','等级','新：横梁——滑铲通过（↓）','新：高墙——换道','新：双道闸门','新：移动方块','语言'],
ja:['プレイ','着せ替え','← → / A D：レーン移動 · ↑ / スペース：ジャンプ · ↓ / S：スライディング。スマホはスワイプ。500点ごとに難しくなります。','クラッシュ！','レベル','新登場：バー — スライディングで通過（↓）','新登場：壁 — レーンを変えよう','新登場：ダブルゲート','新登場：動くブロック','言語'],
pt:['Jogar','Guarda-roupa','← → / A D: faixa · ↑ / Espaço: pulo · ↓ / S: agachar. No celular: deslize. A cada 500 pontos fica mais difícil.','Batida!','Nível','Novo: barras — agache (↓)','Novo: paredes — troque de faixa','Novo: portões duplos','Novo: blocos móveis','Idioma'],
uk:['Грати','Гардероб','← → / A D — смуга · ↑ / пробіл — стрибок · ↓ / S — присід. На телефоні — свайпи. Кожні 500 очок складніше.','Зіткнення!','Рівень','Нове: балки — присідай (↓)','Нове: стіни — змінюй смугу','Нове: подвійні ворота','Нове: рухомі блоки','Мова'],
de:['Spielen','Garderobe','← → / A D: Spur · ↑ / Leertaste: Sprung · ↓ / S: Ducken. Am Handy: Wischen. Alle 500 Punkte wird es schwerer.','Crash!','Level','Neu: Balken — duck dich (↓)','Neu: Wände — Spur wechseln','Neu: Doppeltore','Neu: bewegliche Blöcke','Sprache'],
es:['Jugar','Vestuario','← → / A D: carril · ↑ / Espacio: salto · ↓ / S: agacharse. En el móvil: desliza. Cada 500 puntos es más difícil.','¡Choque!','Nivel','Nuevo: barras — agáchate (↓)','Nuevo: muros — cambia de carril','Nuevo: puertas dobles','Nuevo: bloques móviles','Idioma'],
cs:['Hrát','Šatna','← → / A D: pruh · ↑ / mezerník: skok · ↓ / S: podklouznutí. Na telefonu: swipe. Každých 500 bodů je to těžší.','Náraz!','Úroveň','Nově: trámy — podklouzni (↓)','Nově: zdi — změň pruh','Nově: dvojitá vrata','Nově: pohyblivé bloky','Jazyk']};
let lang=(navigator.language||'en').slice(0,2).toLowerCase();if(!TR[lang])lang='en';
const t=k=>TR[lang][KEYS.indexOf(k)];
const N=(ru,en)=>(lang==='ru'||lang==='uk')?ru:en;

/* ---------- texture painters ---------- */
const dice=(x,w,h)=>{x.fillStyle='#f6f2e8';x.fillRect(0,0,w,h);x.strokeStyle='#bbb';x.lineWidth=6;x.strokeRect(3,3,w-6,h-6);x.fillStyle='#222';for(const [a,b] of [[.28,.28],[.72,.28],[.5,.5],[.28,.72],[.72,.72]]){x.beginPath();x.arc(a*w,b*h,w*.09,0,7);x.fill()}};
const crate=(x,w,h)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#a5732f':'#c4914c';x.fillRect(0,i*h/8,w,h/8)}noise(x,w,h,300,.25);x.strokeStyle='#5b3a16';x.lineWidth=10;x.strokeRect(5,5,w-10,h-10);x.beginPath();x.moveTo(5,5);x.lineTo(w-5,h-5);x.moveTo(w-5,5);x.lineTo(5,h-5);x.stroke()};
const gift=(x,w,h)=>{x.fillStyle='#d62839';x.fillRect(0,0,w,h);noise(x,w,h,150,.15);x.fillStyle='#ffd24a';x.fillRect(w*.42,0,w*.16,h);x.fillRect(0,h*.42,w,h*.16)};
const bball=(x,w,h)=>{x.fillStyle='#e8661a';x.fillRect(0,0,w,h);noise(x,w,h,500,.25);x.strokeStyle='#1b1b1b';x.lineWidth=4;for(const u of [0,.5,1]){x.beginPath();x.moveTo(u*w,0);x.lineTo(u*w,h);x.stroke()}x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();for(const u of [.25,.75]){x.beginPath();x.ellipse(u*w,h/2,w*.12,h/2,0,0,7);x.stroke()}};
const earth=(x,w,h)=>{x.fillStyle='#1f5fbf';x.fillRect(0,0,w,h);x.fillStyle='#3f9b4a';for(let i=0;i<14;i++){x.beginPath();x.ellipse(rnd()*w,h*.15+rnd()*h*.7,8+rnd()*22,6+rnd()*14,rnd()*3,0,7);x.fill()}x.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<10;i++){x.beginPath();x.ellipse(rnd()*w,rnd()*h,10+rnd()*20,3+rnd()*4,0,0,7);x.fill()}x.fillStyle='#fff';x.fillRect(0,0,w,h*.08);x.fillRect(0,h*.92,w,h*.08)};
const eight=(x,w,h)=>{x.fillStyle='#111';x.fillRect(0,0,w,h);x.fillStyle='#f4f4f4';x.beginPath();x.arc(w*.25,h/2,h*.2,0,7);x.fill();x.fillStyle='#111';x.font='bold '+h*.28+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('8',w*.25,h/2+2);x.fillStyle='rgba(255,255,255,.12)';x.fillRect(0,h*.3,w,h*.1)};
const giza=(x,w,h)=>{x.fillStyle='#d8b878';x.fillRect(0,0,w,h);for(let r=0;r<10;r++){const y=r*h/10;x.fillStyle=r%2?'#cfae6a':'#e0c385';x.fillRect(0,y,w,h/10-1);x.fillStyle='#8a6b35';for(let c=(r%2)*32;c<w;c+=64)x.fillRect(c,y,2,h/10)}noise(x,w,h,500,.2)};
const moss=(x,w,h)=>{x.fillStyle='#7d8077';x.fillRect(0,0,w,h);for(let r=0;r<8;r++){x.fillStyle=r%2?'#6f7269':'#868a80';x.fillRect(0,r*h/8,w,h/8-2)}x.fillStyle='rgba(70,140,50,.6)';for(let i=0;i<30;i++){x.beginPath();x.arc(rnd()*w,rnd()*h,3+rnd()*9,0,7);x.fill()}noise(x,w,h,400,.25)};
const goldP=(x,w,h)=>{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fff0a0');g.addColorStop(.5,'#d9a41e');g.addColorStop(1,'#fff0a0');x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='rgba(120,80,0,.5)';x.lineWidth=2;for(let r=1;r<8;r++){x.beginPath();x.moveTo(0,r*h/8);x.lineTo(w,r*h/8);x.stroke()}noise(x,w,h,200,.15)};
const wellP=(x,w,h)=>{x.fillStyle='#8a8d94';x.fillRect(0,0,w,h);for(let r=0;r<6;r++){const y=r*h/6;for(let c=(r%2)*10;c<w;c+=20){x.fillStyle='hsl(220,5%,'+(50+rnd()*14)+'%)';x.fillRect(c+1,y+1,18,h/6-2)}}noise(x,w,h,400,.3)};
const barrel=(x,w,h)=>{x.fillStyle='#8b5a2b';x.fillRect(0,0,w,h);for(let i=0;i<16;i++){x.fillStyle=i%2?'#7a4c22':'#96622f';x.fillRect(i*w/16,0,w/16-1,h)}x.fillStyle='#555a63';x.fillRect(0,h*.12,w,h*.1);x.fillRect(0,h*.78,w,h*.1);noise(x,w,h,250,.2)};
const canP=(x,w,h)=>{x.fillStyle='#d3202f';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.beginPath();x.moveTo(0,h*.55);for(let i=0;i<=w;i+=4)x.lineTo(i,h*.5+Math.sin(i/w*12.56)*h*.1);x.lineTo(w,h*.7);x.lineTo(0,h*.7);x.fill();x.fillStyle='#d9dde3';x.fillRect(0,0,w,h*.07);x.fillRect(0,h*.93,w,h*.07)};
const crys=(c1,c2)=>(x,w,h)=>{const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,c1);g.addColorStop(1,c2);x.fillStyle=g;x.fillRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=2;for(let i=0;i<14;i++){x.beginPath();x.moveTo(rnd()*w,rnd()*h);x.lineTo(rnd()*w,rnd()*h);x.stroke()}x.fillStyle='rgba(255,255,255,.4)';for(let i=0;i<20;i++)x.fillRect(rnd()*w,rnd()*h,2,2)};
const donut=(x,w,h)=>{x.fillStyle='#d9a066';x.fillRect(0,0,w,h);noise(x,w,h,200,.2);x.fillStyle='#ff7fb5';x.fillRect(0,h/2,w,h/2);x.fillStyle='rgba(255,255,255,.28)';x.fillRect(0,h*.56,w,6);for(let i=0;i<80;i++){x.fillStyle=['#fff','#ffe14d','#4dd2ff','#7dff8a','#b06bff'][i%5];x.save();x.translate(rnd()*w,h/2+6+rnd()*(h/2-12));x.rotate(rnd()*3);x.fillRect(-4,-1,8,2.5);x.restore()}};
const tire=(x,w,h)=>{x.fillStyle='#1c1c1f';x.fillRect(0,0,w,h);x.fillStyle='#34343a';for(let i=0;i<w;i+=8)x.fillRect(i,0,4,h);noise(x,w,h,300,.4)};
const goldR=(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#fff2a8');g.addColorStop(.5,'#d9a41e');g.addColorStop(1,'#fff2a8');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<12;i++)x.fillRect(rnd()*w,rnd()*h,3,3)};
const TH=(e,shape,paint,o)=>Object.assign({e,shape,paint},o);
const TIER=[[800,'c'],[1500,'c'],[30,'g']];
const THEMES=[
 TH('🎲',0,dice),TH('📦',0,crate),TH('🎁',0,gift),
 TH('🏀',1,bball),TH('🌍',1,earth),TH('🎱',1,eight),
 TH('🏜️',2,giza),TH('🌿',2,moss),TH('🥇',2,goldP),
 TH('🪣',3,wellP,{cap:0x2a6fbf}),TH('🛢️',3,barrel,{cap:0x6b4423}),TH('🥫',3,canP,{cap:0xc8ccd4}),
 TH('💚',4,crys('#0b8f4d','#7dffb2'),{em:0x063b22}),TH('🔮',4,crys('#6a1b9a','#e1a6ff'),{em:0x2b0a40}),TH('❄️',4,crys('#8fd8ff','#ffffff'),{em:0x1a3a55}),
 TH('🍩',5,donut),TH('🛞',5,tire),TH('💍',5,goldR)
].map((T,i)=>Object.assign(T,{p:TIER[i%3][0],cur:TIER[i%3][1]}));
const themeCv=i=>THEMES[i].cv||(THEMES[i].cv=cvs(128,128,THEMES[i].paint));
const themeUrl=i=>THEMES[i].url||(THEMES[i].url=themeCv(i).toDataURL());
function themeMat(i){const T=THEMES[i];return T.m||(T.m=new THREE.MeshLambertMaterial({map:CT(themeCv(i)),emissive:T.em||0}))}

/* ---------- data ---------- */
const K=(a,b,p,cur,o)=>Object.assign({a,b:b??a,p,cur},o);
const SKINS=[
 K(0xffd34d,null,0,'p'),K(0xff3b30,null,100,'p'),K(0x2f6bff,null,250,'p'),K(0x2ee66b,null,400,'p'),K(0xa64dff,null,600,'p'),
 K(0xff5fc8,null,850,'p'),K(0xff8a1f,null,1100,'p'),K(0x19e3d2,null,1500,'p'),K(0xdfe6f2,null,2000,'p'),K(0xffffff,null,3000,'p',{rainbow:1}),
 K(0xb6ff3b,null,300,'c'),K(0x9fe8ff,0xffffff,500,'c'),K(0xff3b5c,0x2ee66b,800,'c'),K(0xa64dff,0xff8a1f,1000,'c'),K(0xffd34d,0x1a1a1a,1500,'c'),
 K(0xff1744,null,5,'g',{glow:1}),K(0x00e676,null,10,'g',{glow:1}),K(0x2979ff,null,15,'g',{glow:1}),K(0xd500f9,0x7c4dff,25,'g',{glow:1}),K(0xffffff,0x7df9ff,40,'g',{glow:1})];
const ICON={p:'⭐',c:'🪙',g:'💎',t:'🎫'};
const H=(e,sk,sh,pa,ha,p)=>({e,human:1,col:[sk,sh,pa,ha],p});

function halves(g){const n=g.index.count;g.clearGroups();g.addGroup(0,n/2,0);g.addGroup(n/2,n/2,1);return g}
function shapeMesh(id,mats){
  let g;

  else if(id===1)g=halves(new THREE.SphereGeometry(.55,28,18));
  else if(id===2)g=new THREE.ConeGeometry(.7,1.1,4);
  else if(id===3)g=new THREE.CylinderGeometry(.5,.5,1,24);
  else if(id===4){g=new THREE.OctahedronGeometry(.7);g.clearGroups();for(let i=0;i<8;i++)g.addGroup(i*3,3,i%2)}

}

    const piv=(x,y)=>{const p=new THREE.Group();p.position.set(x,y,0);body.add(p);return p};
    add(new THREE.BoxGeometry(.46,.46,.26),sh,0,.2);add(new THREE.BoxGeometry(.48,.07,.28),0x222222,0,-.02);
    add(new THREE.BoxGeometry(.3,.1,.14),0xffffff,0,.38,null,.08);add(new THREE.BoxGeometry(.3,.34,.1),ha,0,.2,null,-.19);

    add(new THREE.BoxGeometry(.3,.05,.12),ha,0,.64,null,.14);add(new THREE.BoxGeometry(.03,.05,.04),sk,0,.55,null,.17);
    for(const s of[-1,1]){add(new THREE.SphereGeometry(.03,8,6),0x111111,s*.065,.58,null,.15);add(new THREE.SphereGeometry(.04,8,6),sk,s*.17,.56)}

let jumps=0,flip=0,inv=0,revived=false,paused=false,world=0,diff=0,lastBuy='',pt=0,W=null,items=[],lane=1,tx=0,y=0,vy=0,sc=1,slideT=0,speed=18,score=0,coins=0,gemRun=0,level=0,running=false,spawnZ=0,last=0;
function toast(s){const e=$('toast');e.textContent=s;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
function reset(){
  for(const i of items)scene.remove(i.m);
  items=[];jumps=0;flip=0;inv=0;revived=false;player.visible=true;lane=1;tx=0;y=0;vy=0;sc=1;slideT=0;speed=18;score=0;coins=0;gemRun=0;level=0;spawnZ=-60;dayTarget=0;wetTarget=0;
  player.scale.y=1;player.position.set(0,.5,0);body.rotation.set(0,0,0);upd();
}
function upd(){$('sc').textContent=Math.floor(score);$('co').textContent=coins;$('gm').textContent=gemRun;$('lv').textContent=level+1}
function addOb(k,x,z){
  const o=OB[k],m=new THREE.Mesh(o.geo,o.mat);m.position.set(x,o.y+o.h/2,z);scene.add(m);
  items.push({m,type:'o',k,y0:o.y,y1:o.y+o.h,hw:o.w/2,ph:rnd()*6});
}
function spawnRow(z){
  if(level>=1&&rnd()<.16+diff*.05){special(z);return}
  const pool=['low'];
  if(level>=1)pool.push('bar');if(level>=2)pool.push('wall');if(level>=3)pool.push('gate');if(level>=4)pool.push('mover');
  let free=Math.floor(rnd()*3);
  if(rnd()<Math.min(.95,.65+level*.05+diff*.06)){
    const k=pick(pool);
    if(k==='gate'){if(free===1)free=rnd()<.5?0:2;addOb(k,-(free-1)*LANE/2,z)}
    else addOb(k,((free+1+Math.floor(rnd()*2))%3-1)*LANE,z);
  }
  if(rnd()<.7)for(let k=0;k<3;k++){
    const m=mkCoin();m.position.set((free-1)*LANE,.9,z-k*2.2);scene.add(m);items.push({m,type:'c',hw:.45});
  }
  if(rnd()<.14){
    const g=Math.floor(rnd()*3),m=mkGem();
    m.position.set((g-1)*LANE,1.1,z-12);scene.add(m);items.push({m,type:'g',hw:.45});
  }
}
function start(w,d){
  audio();world=w;diff=d;applyWorld(w);reset();running=true;paused=false;$('msg').style.display='none';$('pz').style.display='block';
  $('wn').textContent=W.e+' '+N(...DF[d]);last=performance.now();startMusic();toast(W.e+' '+N(...W.n));
}
function die(){
  running=false;stopMusic();rainSound(false);SFX.crash();
  show('<h1>'+t('crash')+'</h1><p>⭐ '+Math.floor(score)+' · 🪙 '+coins+' · 💎 '+gemRun+'</p><p>💎 '+(gemBank+gemRun)+'</p>'+(revived?'':'<button id="rv" class="big">💎 5 · '+N('Продолжить','Continue')+'</button>')+'<button id="fn" class="alt">🏠 '+N('В меню','Menu')+'</button>');
  if(!revived)$('rv').onclick=()=>{
    if(gemBank+gemRun<5){SFX.err();$('rv').textContent='✖ 💎 5';return}
    let c=5;const a=Math.min(gemRun,c);gemRun-=a;c-=a;gemBank-=c;upd();
    revived=true;items=items.filter(i=>{if(i.type==='o'&&i.m.position.z>-40){scene.remove(i.m);return false}return true});
    inv=2.5;running=true;last=performance.now();$('msg').style.display='none';$('pz').style.display='block';SFX.rev();startMusic();rainSound(wetTarget===1);
  };
  $('fn').onclick=()=>fin(0);
}
function fin(win,quiet){
  const s=Math.floor(score),info='⭐ '+s+' · 🪙 '+coins+' · 💎 '+gemRun+' · '+t('lvl')+' '+(level+1)+(win&&diff<2?' · 🔓 '+N(...DF[diff+1]):'');
  if(s>best){best=s;try{localStorage.setItem('runner3d-best',best)}catch(e){}$('bs').textContent=best}
  if(s>(rbest[region]||0))rbest[region]=s;
  if(API&&s>0)fetch(API+'/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({region,name:pname,score:s})}).catch(()=>{});
  if(win){const k=world+':'+diff;if(!cleared.includes(k))cleared.push(k);SFX.lvl()}
  wallet+=s;coinBank+=coins;gemBank+=gemRun;coins=0;gemRun=0;score=0;save();
  if(quiet)showMenu();else showMenu(win?'🏆 '+N('Уровень пройден!','Level cleared!'):t('crash'),info);
}

function showSkins(){

  for(const [k,l] of [['p','⭐🎨'],['c','🪙🎨'],['g','💎🎨'],['m','🔷'],['x','🎭'],['h','🚶']])h+='<button class="tab'+(tab===k?' on':'')+'" data-t="'+k+'">'+l+'</button>';
  h+='</div>';
  if(tab==='h')h+='<div class="row"><button id="x1" class="tab">1 🎫 = 1000 🪙</button><button id="x2" class="tab">1 🎫 = 20 💎</button></div><p>'+hint+'</p>';
  h+='<div class="grid">';
  const card=(a,pv,st,sel)=>'<button class="sk'+(sel?' sel':'')+(a===lastBuy?' flash':'')+'" '+a+'>'+pv+'<small>'+st+'</small></button>';
  const pr=(p,c)=>p+' '+ICON[c];
  if(tab==='m')MODELS.forEach((m,i)=>{if(!m.human){const s=theme<0&&i===model;h+=card('data-m="'+i+'"','<span class="pv">'+m.e+'</span>',s?'✔':'▶',s)}});
  else if(tab==='h')MODELS.forEach((m,i)=>{if(m.human)h+=card('data-m="'+i+'"','<span class="pv" style="background:'+hex(m.col[1])+'">'+m.e+'</span>',theme<0&&i===model?'✔':hum.includes(i)?'▶':pr(m.p,'t'),theme<0&&i===model)});
  else if(tab==='x')THEMES.forEach((T,i)=>h+=card('data-x="'+i+'"','<span class="pv" style="background:url('+themeUrl(i)+') center/cover"><b>'+T.e+'</b></span>',i===theme?'✔':ownedT.includes(i)?'▶':pr(T.p,T.cur),i===theme));
  else SKINS.forEach((s,i)=>{
    if(s.cur!==tab)return;
    const sel=theme<0&&!MODELS[model].human&&i===skin;
    const bg=s.rainbow?'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)':'linear-gradient(135deg,'+hex(s.a)+' 50%,'+hex(s.b)+' 50%)';
    h+=card('data-i="'+i+'"','<span class="pv" style="background:'+bg+'"></span>',sel?'✔':owned.includes(i)?'▶':pr(s.p,s.cur),sel);
  });

    $('x2').onclick=()=>{if(pay('g',20)){tokens++;SFX.sell();hint='+1 🎫'}else hint='✖ 💎';save();showSkins()};
  }
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,s=SKINS[i];
    if(!owned.includes(i)){if(!pay(s.cur,s.p)){fail(b,s.cur);return}owned.push(i);SFX.buy();lastBuy='data-i="'+i+'"'}
    skin=i;theme=-1;if(MODELS[model].human)model=0;save();applySkin();buildBody();showSkins();
  });
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.x,T=THEMES[i];
    if(!ownedT.includes(i)){if(!pay(T.cur,T.p)){fail(b,T.cur);return}ownedT.push(i);SFX.buy();lastBuy='data-x="'+i+'"'}
    theme=i;model=T.shape;save();buildBody();showSkins();
  });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.m,m=MODELS[i];
    if(m.human&&!hum.includes(i)){if(!pay('t',m.p)){fail(b,'t');return}hum.push(i);SFX.buy();lastBuy='data-m="'+i+'"'}
    model=i;theme=-1;save();buildBody();showSkins();
  });
  $('back').onclick=()=>showMenu();
}

addEventListener('keydown',e=>{
  const k=e.key;if(k==='p'||k==='P'||k==='Escape'){togglePause();return}
  if(k==='ArrowLeft'||k==='a')left();
  if(k==='ArrowRight'||k==='d')right();
  if(k==='ArrowUp'||k===' '||k==='w'){e.preventDefault();jump()}
  if(k==='ArrowDown'||k==='s'){e.preventDefault();slide()}
});
let sx=0,sy=0;
addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;

});

  roadTex.offset.y=(roadTex.offset.y+ws*dt/7.5)%1;walkTex.offset.y=(walkTex.offset.y+ws*dt/2)%1;
  for(const s of stripes){s.position.z+=ws*dt;if(s.position.z>8)s.position.z-=180}
  for(const b of city){b.position.z+=ws*dt;if(b.position.z>16)b.position.z-=232}
  for(const l of lamps){l.position.z+=ws*dt;if(l.position.z>12)l.position.z-=LCNT*LSP}
  for(const b of benches){b.position.z+=ws*dt;if(b.position.z>14)b.position.z-=120}
  for(const g of scen){g.position.z+=ws*dt;if(g.position.z>16)g.position.z-=SL;if(g.f)g.f(now)}
  for(let i=trail.length;i--;){const m=trail[i];m.position.z+=ws*dt;m.material.opacity-=dt*.35;if(m.position.z>10||m.material.opacity<=0){scene.remove(m);m.material.dispose();trail.splice(i,1)}}
  for(let i=fxs.length;i--;){const f=fxs[i];f.l-=dt;f.s.position.x+=f.vx*dt;f.s.position.y+=f.vy*dt;f.s.position.z+=(f.vz+ws)*dt;f.s.scale.setScalar(Math.max(.01,f.l*1.2));if(f.l<=0){scene.remove(f.s);fxs.splice(i,1)}}
  for(const p of peds){
    p.g.position.z+=(ws+p.dir*p.sp)*dt;if(p.g.position.z>14)p.g.position.z-=124;
    const sw=Math.sin(now*.008*p.sp+p.ph)*.6;p.legs[0].rotation.x=sw;p.legs[1].rotation.x=-sw;p.arms[0].rotation.x=-sw;p.arms[1].rotation.x=sw;
  }
  if(limbs){
    const sl=running&&slideT>0,air=running&&y>.001;
    if(flip>0)flip-=dt*11;
    if(air){limbs[0].rotation.x=-.9;limbs[2].rotation.x=.5;limbs[1].rotation.x=limbs[3].rotation.x=jumps>1?-3:-2.5}
    else if(sl){limbs[0].rotation.x=-1.4;limbs[2].rotation.x=-.3;limbs[1].rotation.x=limbs[3].rotation.x=-1.7}
    else{const ph=Math.sin(now*.014)*(running?.9:.3);limbs[0].rotation.x=ph;limbs[1].rotation.x=-ph;limbs[2].rotation.x=-ph;limbs[3].rotation.x=ph}
    limbs[1].rotation.z=air?-.35:0;limbs[3].rotation.z=air?.35:0;
    body.rotation.z+=((running?(tx-(lane-1)*LANE)*.2:0)-body.rotation.z)*Math.min(1,dt*12);
    body.rotation.x=sl?-.7:(running&&flip>0?-(6.28-flip):0);
  }

  if(running){
    const L=Math.floor(score/500);
    if(L>level){level=L;SFX.lvl();startMusic();toast(t('lvl')+' '+(L+1)+(L<5?' · '+t('tip'+L):''))}
    const dn=W.fix?0:Math.floor(score/2000)%2,wt=W.fix?0:Math.floor(score/5000)%2;
    if(dn!==dayTarget){dayTarget=dn;toast(dn?'☀️':'🌙')}
    if(wt!==wetTarget){wetTarget=wt;toast(wt?'🌧️':'🌤️');rainSound(wt===1)}
    speed+=(Math.min(42,(18+level*1.6+(score%500)/500*.8)*DM[diff])-speed)*Math.min(1,dt*2);
    score+=dt*speed*.6;
    tx+=((lane-1)*LANE-tx)*Math.min(1,dt*14);
    vy-=26*dt;y+=vy*dt;if(y<0){y=0;vy=0;jumps=0}
    slideT=Math.max(0,slideT-dt);inv=Math.max(0,inv-dt);player.visible=inv<=0||(now/90|0)%2===0;
    sc+=((slideT>0?.5:1)-sc)*Math.min(1,dt*20);
    player.scale.y=sc;player.position.set(tx,.5*sc+y,0);
    if(!limbs)body.rotation.x-=dt*speed*.35;
    cam.position.x=tx*.5;if(W.paint&&y<.01){pt-=dt;if(pt<=0){pt=.05;paint(tx)}}
    spawnZ+=speed*dt;
    if(spawnZ>-60){spawnRow(-100);spawnZ-=Math.max(16,22-level*1.2)*[1.2,1,.9][diff]}
    const ph=slideT>0?.5:1;
    for(const it of items){
      it.m.position.z+=speed*dt;
      if(it.type==='c')it.m.rotation.z+=dt*4;
      if(it.type==='g')it.m.rotation.y+=dt*3;
      if(it.k==='mover')it.m.position.x=Math.sin(now/450+it.ph)*LANE*1.05;
      if(it.k==='train'&&!it.h&&it.m.position.z>-50){it.h=1;it.vx=7;SFX.train()}
      if(it.vx){it.m.position.x+=it.vx*dt;if(it.k==='ped'){if(Math.abs(it.m.position.x)>4.4){it.vx=-it.vx;it.m.rotation.y+=Math.PI}const q=Math.sin(now*.012+it.ph)*.7;it.P.legs[0].rotation.x=q;it.P.legs[1].rotation.x=-q;it.P.arms[0].rotation.x=-q;it.P.arms[1].rotation.x=q}}
      if(it.pk!==undefined){it.pk+=dt*3.5;it.m.position.y+=dt*5;it.m.scale.setScalar(1+it.pk*.9);if(it.pk>1)it.m.visible=false}
      if(Math.abs(it.m.position.z)<(it.hz||.85)&&Math.abs(it.m.position.x-tx)<it.hw+.42&&!it.got&&it.type!=='d'){
        if(it.type==='o'){if(inv<=0&&y<it.y1-.05&&y+ph>it.y0+.05){die();break}}
        else{it.got=true;it.pk=0;if(it.type==='c'){coins++;score+=25;SFX.coin();pop('co')}else{gemRun++;score+=50;SFX.gem();pop('gm')}burst(it.m.position,it.type==='c'?0xffd34d:0xff7df2)}
      }
    }
    items=items.filter(it=>{if(it.m.position.z>8){scene.remove(it.m);return false}return true});
    upd();
    if(running&&score>=GOAL){running=false;stopMusic();rainSound(false);fin(1)}
  }else{
    body.rotation.y+=dt*1.2;player.scale.y=1;player.position.set(0,.5,0);
  }
  renderer.render(scene,cam);
}
applySkin();buildBody();applyWorld(0);showMenu();
reset();requestAnimationFrame(t0=>{last=t0;loop(t0)});
</script>
</body>
